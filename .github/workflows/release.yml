name: Release

on:
  push:
    branches:
      - master
  # Run by hand (Actions → Release → Run workflow) to list the current version on the
  # Official MCP Registry without making a release: only the publish-registry job runs.
  workflow_dispatch:

jobs:
  # ── Step 1: Gate — only proceed if commit message contains 'new-release' ──
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
    steps:
      # The message is passed through the environment, not pasted into the script: a message with
      # quotes in it would otherwise break the script (or run as part of it).
      - name: Check commit message for 'new-release'
        id: check
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$MSG" | grep -q "new-release"; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Step 2: Build JAR + Docker image and create GitHub Release ────────────
  release:
    needs: check-trigger
    if: needs.check-trigger.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Releases and upload assets

    steps:
      # 1. Check out source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build the fat JAR
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Build JAR
        run: mvn clean package -q -DskipTests

      # 3. Read the version from pom.xml (used for the release tag and Docker tag)
      - name: Resolve version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # 4. Create the GitHub Release and attach the JAR
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WhoisFreaks MCP Server v${{ steps.version.outputs.version }}
          body: |
            Released from commit: ${{ github.event.head_commit.message }}
            Commit SHA: ${{ github.sha }}
          files: target/whoisfreaks-mcp-server-*.jar

      # 5. Set up QEMU for cross-platform emulation (arm64 on amd64 runner)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 6. Set up Docker Buildx (required for multi-platform builds and
      #    for the # syntax=docker/dockerfile:1 BuildKit frontend directive)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 8. Build and push the multi-platform image
      #    context: .          → repo root (where pom.xml and src/ live)
      #    file: deploy/Dockerfile → path to Dockerfile from repo root
      #    platforms: linux/amd64,linux/arm64 → covers Intel, Apple Silicon, ARM VMs
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            whoisfreaks/mcp-server:${{ steps.version.outputs.version }}
            whoisfreaks/mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 9. Keep the Docker Hub page in line with the README. Docker Hub cuts a long README off at
      #    25,000 characters. Never fails the release: the image is already pushed by now.
      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: whoisfreaks/mcp-server
          short-description: WhoisFreaks MCP server - WHOIS, DNS, IP and SSL data for AI clients. Hosted at mcp.whoisfreaks.com
          readme-filepath: ./README.md

  # ── Step 3: List the release on the Official MCP Registry ────────────────
  #    Logs in with GitHub OIDC, which proves the workflow runs in the WhoisFreaks
  #    organization (the io.github.WhoisFreaks namespace), so it needs no secret.
  publish-registry:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for the OIDC login
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A pinned release, checked against its Sigstore signature before it runs.
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # The version comes from pom.xml. The registry accepts the Docker package only if
      # the image has the io.modelcontextprotocol.server.name label, so a version whose
      # image was built before the label existed is listed with the hosted server only.
      - name: Prepare server.json
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          IMAGE="docker.io/whoisfreaks/mcp-server:${VERSION}"
          jq --arg v "$VERSION" --arg image "$IMAGE" \
            '.version = $v | .packages |= map(if .registryType == "oci" then .identifier = $image else . end)' \
            server.json > server.tmp && mv server.tmp server.json
          LABEL=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' \
            | jq -r '(if has("config") then .config else .["linux/amd64"].config end).Labels["io.modelcontextprotocol.server.name"] // ""')
          if [ "$LABEL" != "$(jq -r .name server.json)" ]; then
            echo "::warning::$IMAGE has no io.modelcontextprotocol.server.name label, so only the hosted server is listed."
            jq 'del(.packages)' server.json > server.tmp && mv server.tmp server.json
          fi
          cat server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
