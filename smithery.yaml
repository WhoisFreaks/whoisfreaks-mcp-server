name: whoisfreaks
displayName: WhoisFreaks
description: >
  22 domain intelligence tools for AI assistants - live and bulk WHOIS, WHOIS
  history, reverse WHOIS, IP WHOIS, ASN WHOIS, live and bulk DNS, DNS history,
  reverse DNS, IP geolocation and IP reputation (single and bulk), domain
  reputation, SSL certificates, domain availability (single and bulk), subdomain
  enumeration, domain and subdomain typosquatting, and API key usage. Powered by
  the WhoisFreaks API.

iconUrl: https://whoisfreaks.com/favicon.ico
homepage: https://whoisfreaks.com
repository: https://github.com/WhoisFreaks/whoisfreaks-mcp-server
license: MIT

categories:
  - security
  - networking
  - domain

tools:
  - name: liveWhoisLookup
    description: Real-time WHOIS data for any domain
  - name: bulkWhoisLookup
    description: Real-time WHOIS data for up to 100 domains in one request
  - name: whoisHistory
    description: Historical WHOIS records and ownership timeline for a domain
  - name: reverseWhoisLookup
    description: Find all domains tied to an email, owner name, or organization
  - name: ipWhoisLookup
    description: WHOIS registration data for any IPv4 or IPv6 address
  - name: asnWhoisLookup
    description: WHOIS data for any Autonomous System Number (ASN)
  - name: dnsLookup
    description: Live DNS records — A, AAAA, MX, NS, CNAME, TXT, SOA, SPF — and PTR records for an IP
  - name: bulkDnsLookup
    description: Live DNS records for up to 100 domains and 100 IPs in one request
  - name: dnsHistory
    description: Historical DNS record changes with full timeline
  - name: reverseDnsLookup
    description: Find all domains pointing to a given IP or nameserver
  - name: ipGeolocation
    description: Country, city, ISP, and coordinates for any IP address
  - name: bulkIpGeolocation
    description: Geolocation for up to 100 IP addresses in one request
  - name: ipSecurity
    description: IP reputation — VPN, proxy, Tor exit node, relay, bot, spam and attacker flags
  - name: bulkIpSecurity
    description: IP reputation for up to 100 IP addresses in one request
  - name: sslLookup
    description: SSL/TLS certificate details — issuer, expiry, SANs, and chain
  - name: domainAvailability
    description: Check if a domain is available to register, with suggestions
  - name: bulkDomainAvailability
    description: Check up to 100 domains, or one name across up to 100 TLDs
  - name: subdomainLookup
    description: Enumerate all known subdomains for a domain
  - name: domainDiscovery
    description: Find registered domains that are typo variants of a brand (typosquatting)
  - name: subdomainTyposquatting
    description: Find subdomains on any domain that imitate a brand
  - name: domainReputation
    description: Risk verdict, trust score and threat intelligence for a domain
  - name: apiKeyUsage
    description: Credits and subscription requests used by your API key

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        title: WhoisFreaks API Key
        description: >
          Your WhoisFreaks API key. Get one free at https://billing.whoisfreaks.com/signup
        x-sensitive: true
  commandFunction: |-
    (config) => ({
      command: "docker",
      args: [
        "run", "-i", "--rm",
        "-e", `WHOISFREAKS_API_KEY=${config.apiKey}`,
        "--entrypoint", "java",
        "whoisfreaks/mcp-server:latest",
        "-jar", "app.jar"
      ]
    })
