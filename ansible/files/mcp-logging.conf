# Included by the server blocks in conf.d/whoisfreaks-mcp.conf.
# The mcp_noquery format (conf.d/mcp-http.conf) leaves the query string out: a client that can't
# send headers puts its WhoisFreaks API key there (?apiKey=...), and it must never reach a log.
access_log /var/log/nginx/mcp-access.log mcp_noquery;
# nginx's error log quotes the full request line, query string included, on errors and warnings
# (a refused or timed-out request). Only critical problems are logged for these blocks.
error_log /var/log/nginx/mcp-error.log crit;
