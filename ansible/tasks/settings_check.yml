# Stop before doing anything if .env lacks a setting the playbooks need. (inventory.py already
# stopped the run if MCP_SERVER_IP is missing.)
- name: Check the settings from .env
  ansible.builtin.assert:
    that: mcp_hostname | length > 0
    fail_msg: Set MCP_HOSTNAME in ansible/.env (README.md, "Settings"). Nothing changed.
    quiet: true

- name: Check the settings OAuth sign-in needs, since OAUTH_ISSUER is set
  ansible.builtin.assert:
    that:
      - oauth_issuer is match('https?://')
      - oauth_billing_url is match('https?://')
      - oauth_billing_server_token | length > 0
    fail_msg: >-
      OAUTH_ISSUER is set, so OAuth sign-in needs it and BILLING_URL to be http or https URLs, and
      BILLING_SERVER_TOKEN, in ansible/.env (README.md, "OAuth sign-in"). Nothing changed.
    quiet: true
  when: oauth_enabled | bool

- name: Check OPENAI_APPS_CHALLENGE, which nginx serves as it is
  ansible.builtin.assert:
    that: openai_apps_challenge is match('^[A-Za-z0-9._~+/=:-]+$')
    fail_msg: >-
      OPENAI_APPS_CHALLENGE in ansible/.env should be the token OpenAI's plugin portal shows, exactly:
      letters, digits and . _ ~ + / = : - only (README.md, "OpenAI domain verification"). Nothing changed.
    quiet: true
  when: openai_apps_challenge | length > 0
