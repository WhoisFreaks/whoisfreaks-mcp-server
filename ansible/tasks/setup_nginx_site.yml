# Write one server's site (instance: an item of app_instances), with HTTPS once its certificate
# exists, test the nginx config and start or reload nginx.
- name: Check for {{ instance.hostname }}'s certificate and certbot's SSL settings
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - /etc/letsencrypt/live/{{ instance.hostname }}/fullchain.pem
    - /etc/letsencrypt/options-ssl-nginx.conf
    - /etc/letsencrypt/ssl-dhparams.pem
  register: node_ssl_files
  become: true

- name: Write the site for {{ instance.hostname }}
  ansible.builtin.template:
    src: node-site.conf.j2
    dest: /etc/nginx/conf.d/{{ instance.nginx_conf }}
    mode: "0644"
  vars:
    node_has_cert: "{{ node_ssl_files.results[0].stat.exists }}"
    certbot_options: "{{ node_ssl_files.results[1].stat.exists }}"
    certbot_dhparam: "{{ node_ssl_files.results[2].stat.exists }}"
  register: node_site
  become: true

- name: Test the nginx config
  ansible.builtin.command: nginx -t
  changed_when: false
  become: true

# "nginx -t" leaves an empty /run/nginx.pid behind when nginx isn't running. Created from this login
# rather than by the service, it has the wrong SELinux label, so the service can't open it and its
# start times out ("open() /var/run/nginx.pid failed (13: Permission denied)").
- name: Check whether nginx is running
  ansible.builtin.command: systemctl is-active nginx
  register: nginx_active
  failed_when: false
  changed_when: false
  check_mode: false
  become: true

- name: Remove the PID file the config test left behind
  ansible.builtin.file:
    path: /run/nginx.pid
    state: absent
  become: true
  when: nginx_active.stdout | trim != 'active'

- name: Start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
  register: nginx_started
  become: true

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  become: true
  when: (node_site.changed or nginx_files_changed) and not nginx_started.changed
