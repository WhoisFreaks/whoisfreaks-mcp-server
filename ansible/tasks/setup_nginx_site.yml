# Write the site (with HTTPS once its certificate exists), test the nginx config and start or
# reload nginx.
- name: Check for {{ mcp_hostname }}'s certificate and certbot's SSL settings
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - /etc/letsencrypt/live/{{ mcp_hostname }}/fullchain.pem
    - /etc/letsencrypt/options-ssl-nginx.conf
    - /etc/letsencrypt/ssl-dhparams.pem
  register: node_ssl_files
  become: true

- name: Write the site for {{ mcp_hostname }}
  ansible.builtin.template:
    src: node-site.conf.j2
    dest: /etc/nginx/conf.d/whoisfreaks-mcp.conf
    mode: "0644"
  vars:
    node_has_cert: "{{ node_ssl_files.results[0].stat.exists }}"
    certbot_options: "{{ node_ssl_files.results[1].stat.exists }}"
    certbot_dhparam: "{{ node_ssl_files.results[2].stat.exists }}"
  register: node_site
  become: true

- name: Test the nginx config
  ansible.builtin.command: nginx -t
  changed_when: false
  become: true

- name: Start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
  register: nginx_started
  become: true

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  become: true
  when: (node_site.changed or nginx_files_changed) and not nginx_started.changed
