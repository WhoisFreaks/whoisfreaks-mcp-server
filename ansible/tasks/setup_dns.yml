# setup.yml, DNS part, for one hostname (dns_hostname: MCP_HOSTNAME, and MCP_OAUTH_HOSTNAME when it is
# set). With CF_DNS_API_TOKEN: an A record dns_hostname -> the machine's IP in Cloudflare,
# DNS only (not proxied), then a wait until it resolves. CF_ZONE may be the zone's name or its ID (the
# 32 characters shown as "Zone ID" on the zone's overview page); an ID is used as it is. Without it, DNS is yours to set: this only
# checks that the name resolves, since Let's Encrypt needs it to.
- name: Point {{ dns_hostname }} at {{ ansible_host }} in Cloudflare
  when: cf_dns_api_token | length > 0
  block:
    - name: Find the {{ cf_zone }} zone in Cloudflare
      when: not cf_zone_is_id
      ansible.builtin.uri:
        url: "{{ cf_api_base }}/zones?name={{ cf_zone }}"
        headers:
          Authorization: "Bearer {{ cf_dns_api_token }}"
      register: cf_zone_read
      failed_when: false
      no_log: true
      check_mode: false
      delegate_to: localhost

    - name: Check the zone was found
      ansible.builtin.assert:
        that: cf_zone_read.json.result | default([]) | length == 1
        fail_msg: >-
          Couldn't find a zone named {{ cf_zone }}. Set CF_ZONE in ansible/.env to the zone's name (e.g. example.com) or
          its Zone ID, and check the DNS token has Zone Read and DNS Edit on it. Cloudflare said:
          {{ cf_zone_read.json.errors | default(cf_zone_read.msg | default('nothing')) }}
        quiet: true
      when: not cf_zone_is_id

    - name: Keep the zone's ID
      ansible.builtin.set_fact:
        cf_zone_id: "{{ cf_zone if cf_zone_is_id else cf_zone_read.json.result[0].id }}"

    - name: Read the DNS record for {{ dns_hostname }}
      ansible.builtin.uri:
        url: "{{ cf_api_base }}/zones/{{ cf_zone_id }}/dns_records?type=A&name={{ dns_hostname }}"
        headers:
          Authorization: "Bearer {{ cf_dns_api_token }}"
      register: cf_record_read
      failed_when: false
      no_log: true
      check_mode: false
      delegate_to: localhost

    - name: Check the record could be read
      ansible.builtin.assert:
        that: cf_record_read.json.success | default(false)
        fail_msg: >-
          Couldn't read the DNS records of zone {{ cf_zone }}. Check that CF_ZONE is the zone {{ dns_hostname }} is in and
          that the DNS token has DNS Edit on it. Cloudflare said:
          {{ cf_record_read.json.errors | default(cf_record_read.msg | default('nothing')) }}
        quiet: true

    - name: Create or fix the record {{ dns_hostname }} -> {{ ansible_host }}
      ansible.builtin.uri:
        url: >-
          {{ cf_api_base }}/zones/{{ cf_zone_id }}/dns_records{{
          '/' ~ cf_record_read.json.result[0].id if cf_record_read.json.result | length > 0 else '' }}
        method: "{{ 'PUT' if cf_record_read.json.result | length > 0 else 'POST' }}"
        headers:
          Authorization: "Bearer {{ cf_dns_api_token }}"
        body_format: json
        body:
          type: A
          name: "{{ dns_hostname }}"
          content: "{{ ansible_host }}"
          ttl: 1
          proxied: false
      register: cf_record_write
      failed_when: not (cf_record_write.json.success | default(false))
      changed_when: true
      no_log: true
      delegate_to: localhost
      when: >-
        cf_record_read.json.result | length == 0
        or cf_record_read.json.result[0].content != ansible_host
        or cf_record_read.json.result[0].proxied

    - name: Wait until {{ dns_hostname }} resolves to {{ ansible_host }}
      ansible.builtin.command: getent ahostsv4 {{ dns_hostname }}
      register: node_dns
      until: ansible_host in node_dns.stdout
      retries: 30
      delay: 10
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

- name: Check {{ dns_hostname }} resolves
  when: cf_dns_api_token | length == 0
  block:
    - name: Look it up
      ansible.builtin.command: getent ahostsv4 {{ dns_hostname }}
      register: own_dns
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Stop unless it does
      ansible.builtin.assert:
        that: own_dns.rc == 0
        fail_msg: >-
          {{ dns_hostname }} doesn't resolve. Point it at {{ ansible_host }} (an A record) and run setup.yml again, or
          put CF_DNS_API_TOKEN in ansible/.env to have setup.yml create the record in Cloudflare.
        quiet: true
