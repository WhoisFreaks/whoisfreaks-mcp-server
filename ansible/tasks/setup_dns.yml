# setup.yml, DNS part. With CF_DNS_API_TOKEN: an A record MCP_HOSTNAME -> the machine's IP in Cloudflare,
# DNS only (not proxied), then a wait until it resolves. Without it, DNS is yours to set: this only
# checks that the name resolves, since Let's Encrypt needs it to.
- name: Point {{ mcp_hostname }} at {{ ansible_host }} in Cloudflare
  when: cf_dns_api_token | length > 0
  block:
    - name: Find the {{ cf_zone }} zone in Cloudflare
      ansible.builtin.uri:
        url: https://api.cloudflare.com/client/v4/zones?name={{ cf_zone }}
        headers:
          Authorization: "Bearer {{ cf_dns_api_token }}"
      register: cf_zone_read
      failed_when: false
      no_log: true
      check_mode: false
      delegate_to: localhost

    - name: Check the zone was found
      ansible.builtin.assert:
        that: cf_zone_read.json.result | default([]) | length == 1
        fail_msg: "Couldn't find zone {{ cf_zone }}; the DNS token needs Zone Read and DNS Edit on it. Cloudflare said: {{ cf_zone_read.json.errors | default(cf_zone_read.msg | default('nothing')) }}"
        quiet: true

    - name: Read the DNS record for {{ mcp_hostname }}
      ansible.builtin.uri:
        url: https://api.cloudflare.com/client/v4/zones/{{ cf_zone_read.json.result[0].id }}/dns_records?type=A&name={{ mcp_hostname }}
        headers:
          Authorization: "Bearer {{ cf_dns_api_token }}"
      register: cf_record_read
      failed_when: false
      no_log: true
      check_mode: false
      delegate_to: localhost

    - name: Check the record could be read
      ansible.builtin.assert:
        that: cf_record_read.json.success | default(false)
        fail_msg: "Couldn't read the DNS records of {{ cf_zone }}. Cloudflare said: {{ cf_record_read.json.errors | default(cf_record_read.msg | default('nothing')) }}"
        quiet: true

    - name: Create or fix the record {{ mcp_hostname }} -> {{ ansible_host }}
      ansible.builtin.uri:
        url: >-
          https://api.cloudflare.com/client/v4/zones/{{ cf_zone_read.json.result[0].id }}/dns_records{{
          '/' ~ cf_record_read.json.result[0].id if cf_record_read.json.result | length > 0 else '' }}
        method: "{{ 'PUT' if cf_record_read.json.result | length > 0 else 'POST' }}"
        headers:
          Authorization: "Bearer {{ cf_dns_api_token }}"
        body_format: json
        body:
          type: A
          name: "{{ mcp_hostname }}"
          content: "{{ ansible_host }}"
          ttl: 1
          proxied: false
      register: cf_record_write
      failed_when: not (cf_record_write.json.success | default(false))
      changed_when: true
      no_log: true
      delegate_to: localhost
      when: >-
        cf_record_read.json.result | length == 0
        or cf_record_read.json.result[0].content != ansible_host
        or cf_record_read.json.result[0].proxied

    - name: Wait until {{ mcp_hostname }} resolves to {{ ansible_host }}
      ansible.builtin.command: getent ahostsv4 {{ mcp_hostname }}
      register: node_dns
      until: ansible_host in node_dns.stdout
      retries: 30
      delay: 10
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

- name: Check {{ mcp_hostname }} resolves
  when: cf_dns_api_token | length == 0
  block:
    - name: Look it up
      ansible.builtin.command: getent ahostsv4 {{ mcp_hostname }}
      register: own_dns
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Stop unless it does
      ansible.builtin.assert:
        that: own_dns.rc == 0
        fail_msg: >-
          {{ mcp_hostname }} doesn't resolve. Point it at {{ ansible_host }} (an A record) and run setup.yml again, or
          put CF_DNS_API_TOKEN in ansible/.env to have setup.yml create the record in Cloudflare.
        quiet: true
