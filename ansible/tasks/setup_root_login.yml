# setup.yml, right after the login user exists: SSH logins as root are refused from here on. This runs
# logged in as the login user with sudo, so it can only happen once that login works; if it doesn't,
# the play fails before this and root stays usable.
- name: Block SSH logins as root
  become: true
  block:
    - name: Add an sshd setting that refuses root
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-whoisfreaks-mcp.conf
        content: |
          # Written by ansible/setup.yml
          PermitRootLogin no
        mode: "0600"
      register: sshd_setting

    - name: Test the sshd config
      ansible.builtin.command: sshd -t
      changed_when: false
      when: sshd_setting.changed

    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: sshd
        state: reloaded
      when: sshd_setting.changed

    - name: Read the settings sshd uses
      ansible.builtin.command: sshd -T
      register: sshd_effective
      changed_when: false
      check_mode: false

    - name: Check root can't log in
      ansible.builtin.assert:
        that: "'permitrootlogin no' in sshd_effective.stdout_lines"
        fail_msg: sshd still allows root logins; check that /etc/ssh/sshd_config includes /etc/ssh/sshd_config.d/*.conf.
        quiet: true
      when: not ansible_check_mode
