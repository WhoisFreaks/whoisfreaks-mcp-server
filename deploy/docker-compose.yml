version: "3.9"

# WhoisFreaks MCP Server — hosted Streamable HTTP server
#
# No API key is configured here: every client sends its own WhoisFreaks key
# (Authorization: Bearer <key>, X-API-Key header, or ?apiKey= query parameter).
#
# Start:
#   docker compose -f deploy/docker-compose.yml up -d
#
# Point your MCP client at:
#   http://localhost:3100/mcp          (local)
#   https://your-domain/mcp            (production, behind Nginx/Caddy for HTTPS — see README)

services:
  whoisfreaks-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: whoisfreaks/mcp-server:latest
    container_name: whoisfreaks-mcp
    restart: unless-stopped
    ports:
      - "3100:3100"

  # OAuth mode, for the WhoisFreaks plugin in ChatGPT and Codex (README: "OAuth Mode"). Serve it on
  # its own host name. The four variables come from the environment or a .env file next to this one.
  # It only starts when asked for:
  #   docker compose -f deploy/docker-compose.yml --profile oauth up -d
  whoisfreaks-mcp-oauth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: whoisfreaks/mcp-server:latest
    container_name: whoisfreaks-mcp-oauth
    restart: unless-stopped
    profiles: ["oauth"]
    ports:
      - "3101:3100"
    environment:
      MCP_AUTH: oauth
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      MCP_RESOURCE: ${MCP_RESOURCE:-}
      BILLING_URL: ${BILLING_URL:-}
      BILLING_SERVER_TOKEN: ${BILLING_SERVER_TOKEN:-}
